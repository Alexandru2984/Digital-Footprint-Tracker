name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: swift:6.2-jammy@sha256:1c1f422aee767a7f33b88bc3aee99cad5de4af8723fbee8a3ab6951a6879f929

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Cache SPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build & Test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs in parallel with the build/test job — failures here surface as
    # inline annotations on the PR but do not block merge (warning-only
    # severity for most rules in .swiftlint.yml).
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Download the upstream static binary and verify the release digest. This
      # replaces an unmaintained third-party Docker action last released in 2020.
      - name: Run pinned SwiftLint
        env:
          SWIFTLINT_VERSION: "0.65.0"
          SWIFTLINT_SHA256: "79306a34e5c7cc55a220cd108cbb861dcad5f10138dcdf261e2624ae8b0a486b"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/swiftlint.zip"
          install_dir="$RUNNER_TEMP/swiftlint"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip" \
            --output "$archive"
          printf '%s  %s\n' "$SWIFTLINT_SHA256" "$archive" | sha256sum --check
          mkdir -p "$install_dir"
          unzip -q "$archive" swiftlint-static -d "$install_dir"
          "$install_dir/swiftlint-static" --reporter github-actions-logging

  deploy:
    name: Deploy to VPS
    needs: [test, lint]
    # Only push events on main trigger a deploy. Pull requests run the
    # test + lint jobs above but never reach this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # No concurrency overlap — if a second push lands while one deploy is
    # mid-flight, the second waits for the first to finish so we don't
    # have two `git pull + swift build` racing on the same checkout.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      # The deploy key is stored base64-encoded as a single-line secret so the
      # GitHub Secrets UI cannot corrupt PEM line endings on copy-paste — the
      # earlier OpenSSH-format secret reliably produced `error in libcrypto`
      # from ssh-add. Decoding inside the workflow guarantees the bytes
      # ssh-add sees match the bytes ssh-keygen wrote on the VPS.
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY_B64:  ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST:         ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT:         ${{ secrets.DEPLOY_PORT }}
          DEPLOY_HOST_PUBKEY:  ${{ secrets.DEPLOY_HOST_PUBKEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_SSH_KEY_B64:?missing DEPLOY_SSH_KEY_B64}"
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_PORT:?missing DEPLOY_PORT}"
          : "${DEPLOY_HOST_PUBKEY:?missing DEPLOY_HOST_PUBKEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strip every whitespace char (newlines/spaces/tabs) before decoding
          # so accidental copy-paste line-wrapping in the GitHub Secrets UI
          # can't corrupt the resulting binary — base64 itself never contains
          # whitespace, so stripping is always safe.
          printf '%s' "$DEPLOY_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Sanity-check: ssh-keygen -y emits the public half. If decoding
          # produced garbage, this fails loudly before we waste a job slot.
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          # Pin the VPS host key so we never trust a key discovered over the same
          # connection that is about to deploy prod. DEPLOY_HOST_PUBKEY holds only
          # the server's *public* host key ("ssh-ed25519 AAAA…") — not secret; the
          # value is what pins the identity. We build the known_hosts host field
          # from the same DEPLOY_HOST/DEPLOY_PORT the ssh command uses, so the
          # canonical form (bare host on :22, "[host]:port" otherwise) always
          # matches what ssh looks up at connect time.
          if [ "$DEPLOY_PORT" = "22" ]; then hostspec="$DEPLOY_HOST"; else hostspec="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          printf '%s %s\n' "$hostspec" "$DEPLOY_HOST_PUBKEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$hostspec" -f ~/.ssh/known_hosts > /dev/null

      - name: Trigger deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        # The authorized_keys entry on the VPS has `command="…/deploy.sh"`
        # set, so sshd runs scripts/deploy.sh regardless of what we send —
        # the trailing "deploy" word is just a harmless placeholder.
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?missing DEPLOY_USER}"
          : "${DEPLOY_PORT:?missing DEPLOY_PORT}"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy
