name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build & Test
        run: swift test

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    # Runs in parallel with the build/test job — failures here surface as
    # inline annotations on the PR but do not block merge (warning-only
    # severity for most rules in .swiftlint.yml).
    steps:
      - uses: actions/checkout@v4

      - name: Run SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --reporter github-actions-logging

  deploy:
    name: Deploy to VPS
    needs: [test, lint]
    # Only push events on main trigger a deploy. Pull requests run the
    # test + lint jobs above but never reach this job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # No concurrency overlap — if a second push lands while one deploy is
    # mid-flight, the second waits for the first to finish so we don't
    # have two `git pull + swift build` racing on the same checkout.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      # The deploy key is stored base64-encoded as a single-line secret so the
      # GitHub Secrets UI cannot corrupt PEM line endings on copy-paste — the
      # earlier OpenSSH-format secret reliably produced `error in libcrypto`
      # from ssh-add. Decoding inside the workflow guarantees the bytes
      # ssh-add sees match the bytes ssh-keygen wrote on the VPS.
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_HOST:        ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT:        ${{ secrets.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Strip every whitespace char (newlines/spaces/tabs) before decoding
          # so accidental copy-paste line-wrapping in the GitHub Secrets UI
          # can't corrupt the resulting binary — base64 itself never contains
          # whitespace, so stripping is always safe.
          echo "$DEPLOY_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Sanity-check: ssh-keygen -y emits the public half. If decoding
          # produced garbage, this fails loudly before we waste a job slot.
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Trigger deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        # The authorized_keys entry on the VPS has `command="…/deploy.sh"`
        # set, so sshd runs scripts/deploy.sh regardless of what we send —
        # the trailing "deploy" word is just a harmless placeholder.
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" deploy
