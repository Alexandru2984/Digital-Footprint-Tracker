version: '3.9'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://footprint:footprint@db:5432/footprint
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: footprint
      POSTGRES_USER: footprint
      POSTGRES_PASSWORD: footprint
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footprint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
