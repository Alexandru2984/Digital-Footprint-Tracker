<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Footprint Tracker</title>
    <link rel="stylesheet" href="/tailwind.css"
          integrity="sha384-IKlUyzvRfnR8Y0kjuchWSr8JVGBH49TvNdDT6rT9RdbN0g51LSustvDRVtKTXE+e"
          crossorigin="anonymous">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(16, 185, 129, 0.5);
            animation: scan 2s linear infinite;
            display: none;
        }
        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
        .is-scanning .scan-line {
            display: block;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body class="font-mono min-h-screen flex flex-col relative overflow-x-hidden">
    <!-- Grid Background Pattern -->
    <div class="absolute inset-0 pointer-events-none opacity-10" style="background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px); background-size: 30px 30px;"></div>

    <main class="flex-grow container mx-auto px-4 py-8 relative z-10 flex flex-col max-w-5xl">
        <!-- Header -->
        <header class="mb-10 text-center sm:text-left border-b border-dark-700 pb-6 flex items-center gap-4">
            <div class="p-3 bg-dark-800 rounded-lg border border-dark-700 shadow-[0_0_15px_rgba(16,185,129,0.2)] text-brand-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                    <path d="M2 12h20"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white drop-shadow-md">OSINT <span class="text-brand-500">FOOTPRINT TRACKER</span></h1>
                <p class="text-slate-400 text-sm mt-1">Aggregated target intel analysis module</p>
            </div>
        </header>

        <!-- Search Panel -->
        <section class="bg-dark-800 border border-dark-700 rounded-xl p-6 shadow-xl mb-8 relative overflow-hidden" id="search-panel">
            <div class="scan-line"></div>
            <form id="scan-form" class="relative z-10">
                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="flex-grow relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-brand-500">
                            <span class="">&gt;_</span>
                        </div>
                        <input type="text" id="target-input" class="bg-dark-900 border border-dark-700 text-white text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full pl-10 p-3 outline-none transition-all placeholder-slate-500" placeholder="Enter target email or username..." required autocomplete="off">
                    </div>
                    <button type="submit" id="scan-btn" class="text-white bg-brand-600 hover:bg-brand-500 focus:ring-4 focus:outline-none focus:ring-brand-500/50 font-medium rounded-lg text-sm px-8 py-3 text-center transition-colors flex items-center justify-center gap-2 whitespace-nowrap shadow-[0_0_10px_rgba(16,185,129,0.3)] hover:shadow-[0_0_20px_rgba(16,185,129,0.5)]">
                        <span id="btn-text">INITIATE SCAN</span>
                        <svg id="btn-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14"></path>
                            <path d="m12 5 7 7-7 7"></path>
                        </svg>
                        <svg id="loading-icon" class="animate-spin hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </section>

        <!-- Status Terminal (Optional, hidden initially) -->
        <section id="status-terminal" class="bg-dark-900 border border-dark-700 rounded-xl p-4 mb-8 hidden shadow-inner h-32 overflow-y-auto text-xs text-brand-500 leading-relaxed">
        </section>

        <!-- Results Panel -->
        <section id="results-panel" class="hidden flex-col gap-6">
            <div class="flex items-center justify-between border-b border-dark-700 pb-2">
                <h2 class="text-xl font-bold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-500">
                        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                        <path d="M3 9h18"></path>
                        <path d="M9 21V9"></path>
                    </svg>
                    ANALYSIS REPORT
                </h2>
                <div class="text-xs px-2 py-1 bg-dark-700 rounded text-slate-300 shadow-inner">
                    SCAN ID: <span id="scan-id-display" class="text-white selection:bg-brand-500"></span>
                </div>
            </div>

            <!-- Empty State / No findings -->
            <div id="empty-state" class="hidden text-center py-12 bg-dark-800 rounded-xl border border-dark-700 border-dashed">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="mx-auto text-slate-500 mb-4">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </svg>
                <h3 class="text-lg font-medium text-slate-300">No Footprint Detected</h3>
                <p class="text-slate-500 text-sm mt-1">The plugins did not return any positive matches.</p>
            </div>

            <!-- Results Grid -->
            <div id="results-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <!-- Result Cards will be injected here -->
            </div>
        </section>

    </main>

    <footer class="mt-auto py-6 border-t border-dark-700 text-center text-xs text-slate-500">
        <p>Digital Footprint Tracker v1.0.0 &copy; 2026. Secure VPS Environment.</p>
    </footer>

    <script>
        const form = document.getElementById('scan-form');
        const input = document.getElementById('target-input');
        const scanBtn = document.getElementById('scan-btn');
        const btnText = document.getElementById('btn-text');
        const btnIcon = document.getElementById('btn-icon');
        const loadingIcon = document.getElementById('loading-icon');
        const searchPanel = document.getElementById('search-panel');
        const statusTerminal = document.getElementById('status-terminal');
        const resultsPanel = document.getElementById('results-panel');
        const resultsGrid = document.getElementById('results-grid');
        const emptyState = document.getElementById('empty-state');
        const scanIdDisplay = document.getElementById('scan-id-display');

        // Polling configuration: 40 attempts × 3 s = 2 min total window.
        const POLL_INTERVAL_MS = 3000;
        const MAX_POLLS = 40;
        let pollCount = 0;

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // logStatus(text, cssClass) — always uses textContent so no caller
        // needs to sanitise values before passing them here.
        function logStatus(text, cssClass = null) {
            statusTerminal.classList.remove('hidden');
            const time = new Date().toISOString().split('T')[1].split('.')[0];
            const line = document.createElement('div');

            const timeSpan = document.createElement('span');
            timeSpan.className = 'text-slate-500';
            timeSpan.textContent = `[${time}]`;
            line.appendChild(timeSpan);
            line.appendChild(document.createTextNode(' '));

            if (cssClass) {
                const msgSpan = document.createElement('span');
                msgSpan.className = cssClass;
                msgSpan.textContent = text;
                line.appendChild(msgSpan);
            } else {
                line.appendChild(document.createTextNode(text));
            }

            statusTerminal.appendChild(line);
            statusTerminal.scrollTop = statusTerminal.scrollHeight;
        }

        function setScanningState(isScanning) {
            if (isScanning) {
                scanBtn.disabled = true;
                input.disabled = true;
                btnText.textContent = 'SCANNING...';
                btnIcon.classList.add('hidden');
                loadingIcon.classList.remove('hidden');
                searchPanel.classList.add('is-scanning');
                statusTerminal.innerHTML = '';
                resultsPanel.classList.add('hidden');
                resultsGrid.innerHTML = '';
            } else {
                scanBtn.disabled = false;
                input.disabled = false;
                btnText.textContent = 'INITIATE SCAN';
                loadingIcon.classList.add('hidden');
                btnIcon.classList.remove('hidden');
                searchPanel.classList.remove('is-scanning');
            }
        }

        // Returns a DOM element (not an HTML string) so untrusted values are
        // always assigned via textContent — never injected into innerHTML.
        function createResultCard(result) {
            let scoreColor = 'text-green-500';
            if (result.confidenceScore < 0.5) scoreColor = 'text-red-500';
            else if (result.confidenceScore < 0.8) scoreColor = 'text-yellow-500';

            const card = document.createElement('div');
            card.className = 'bg-dark-800 border border-dark-700 rounded-xl overflow-hidden shadow-lg transition-transform hover:scale-[1.01] hover:border-brand-500/50';

            card.innerHTML = `
                <div class="px-4 py-3 bg-dark-900 border-b border-dark-700 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                        <span class="js-source font-bold text-slate-200"></span>
                    </div>
                    <span class="js-type text-xs px-2 py-0.5 rounded bg-dark-700 text-slate-300 border border-dark-600"></span>
                </div>
                <div class="p-4">
                    <div class="flex justify-between items-end mb-4">
                        <div>
                            <p class="text-xs text-slate-500 mb-1">CONFIDENCE SCORE</p>
                            <p class="text-xl font-bold ${scoreColor}">${(result.confidenceScore * 100).toFixed(0)}%</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-slate-500 mb-1">MATCH DATA</p>
                            <p class="js-raw-data text-sm text-white"></p>
                        </div>
                    </div>
                    <div class="mt-4">
                        <p class="text-xs text-slate-500 mb-2">RAW JSON OUTPUT</p>
                        <div class="bg-[#0b1120] rounded p-3 text-xs text-brand-500 overflow-x-auto border border-dark-900">
                            <pre><code class="js-json"></code></pre>
                        </div>
                    </div>
                </div>
            `;

            // Assign all API-sourced values via textContent to prevent XSS.
            card.querySelector('.js-source').textContent = result.source;
            card.querySelector('.js-type').textContent = result.type;
            card.querySelector('.js-raw-data').textContent = result.rawData;
            card.querySelector('.js-json').textContent = JSON.stringify(result, null, 2);

            return card;
        }

        function displayResults(data) {
            setScanningState(false);
            resultsPanel.classList.remove('hidden');
            scanIdDisplay.textContent = data.scanID;

            if (!data.results || data.results.length === 0) {
                emptyState.classList.remove('hidden');
                resultsGrid.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                resultsGrid.classList.remove('hidden');
                data.results.forEach(res => resultsGrid.appendChild(createResultCard(res)));
            }
        }

        // Recursive setTimeout avoids overlapping polls if a request is slow.
        async function pollResults(scanID) {
            pollCount++;
            logStatus(`Polling... (attempt ${pollCount}/${MAX_POLLS})`);

            try {
                const response = await fetch(`/api/results/${encodeURIComponent(scanID)}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                logStatus(`Status: ${data.status} | ${data.results.length} result(s) found.`);

                if (data.status === 'completed' || data.status === 'failed') {
                    displayResults(data);
                    if (data.status === 'failed') {
                        logStatus('Scan finished with errors. Partial results may be shown.', 'text-red-500');
                    } else {
                        logStatus('Scan completed successfully.');
                    }
                } else if (pollCount < MAX_POLLS) {
                    setTimeout(() => pollResults(scanID), POLL_INTERVAL_MS);
                } else {
                    setScanningState(false);
                    logStatus('Scan is taking longer than expected. Refresh the page to check again.', 'text-yellow-500');
                }
            } catch (error) {
                logStatus('Poll error: ' + error.message, 'text-red-500');
                if (pollCount < MAX_POLLS) {
                    setTimeout(() => pollResults(scanID), POLL_INTERVAL_MS);
                } else {
                    setScanningState(false);
                    logStatus('Scan timed out.', 'text-red-500');
                }
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const target = input.value.trim();
            if (!target) return;

            setScanningState(true);
            logStatus('Initiating scan against target: ' + target);
            pollCount = 0;

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: target })
                });

                if (!response.ok) {
                    const errText = await response.text().catch(() => response.status);
                    throw new Error(String(errText));
                }

                const data = await response.json();
                logStatus('Scan queued with ID: ' + data.scanID);

                // Start polling after first interval so backend has time to begin processing.
                setTimeout(() => pollResults(data.scanID), POLL_INTERVAL_MS);

            } catch (error) {
                logStatus('Error initiating scan: ' + error.message, 'text-red-500');
                setScanningState(false);
            }
        });
    </script>
</body>
</html>
