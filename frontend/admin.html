<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Digital Footprint Tracker</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/tailwind.css?v=3"
          integrity="sha384-34m0ufNg1LQjTnhwvUa5trS31MwJQn9U+dnk9kKROVsBr0WLRSOSVwH+kOqEO7/Q"
          crossorigin="anonymous">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
    <script src="/d3.min.js"></script>
</head>
<body class="font-mono min-h-screen flex flex-col relative overflow-x-hidden">
    <div class="absolute inset-0 pointer-events-none opacity-10" style="background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px); background-size: 30px 30px;"></div>

    <main class="flex-grow container mx-auto px-4 py-8 relative z-10 max-w-5xl">
        <!-- Header -->
        <header class="mb-6 sm:mb-10 border-b border-dark-700 pb-4 sm:pb-6 flex flex-wrap items-center gap-3 sm:gap-4">
            <div class="p-3 bg-dark-800 rounded-lg border border-dark-700 shadow-[0_0_15px_rgba(16,185,129,0.2)] text-yellow-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/>
                </svg>
            </div>
            <div class="flex-grow">
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">ADMIN <span class="text-yellow-400">DASHBOARD</span></h1>
                <p class="text-slate-400 text-sm mt-1">Digital Footprint Tracker — platform overview</p>
            </div>
            <div class="flex w-full sm:w-auto sm:ml-auto items-center gap-2">
                <a href="/" class="text-xs px-3 py-1.5 bg-dark-800 border border-dark-700 rounded text-slate-400 hover:text-white hover:border-brand-500/50 transition-colors">← HOME</a>
                <button id="logout-btn" class="text-xs px-3 py-1.5 bg-dark-800 border border-dark-700 rounded text-slate-400 hover:text-red-400 hover:border-red-500/50 transition-colors">LOGOUT</button>
            </div>
        </header>

        <!-- Loading / Error state -->
        <div id="loading-state" class="text-center py-20 text-slate-500 text-sm">Loading dashboard…</div>
        <div id="error-state" class="hidden text-center py-20 text-red-400 text-sm"></div>

        <!-- Dashboard content -->
        <div id="dashboard-content" class="hidden space-y-8">

            <!-- Stat cards -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-dark-800 border border-dark-700 rounded-xl p-5 shadow-xl">
                    <p class="text-xs text-slate-500 uppercase tracking-widest mb-2">Total Scans</p>
                    <p id="stat-total-scans" class="text-4xl font-bold text-white">—</p>
                </div>
                <div class="bg-dark-800 border border-dark-700 rounded-xl p-5 shadow-xl">
                    <p class="text-xs text-slate-500 uppercase tracking-widest mb-2">Total Users</p>
                    <p id="stat-total-users" class="text-4xl font-bold text-brand-400">—</p>
                </div>
                <div class="bg-dark-800 border border-dark-700 rounded-xl p-5 shadow-xl">
                    <p class="text-xs text-slate-500 uppercase tracking-widest mb-2">Total Findings</p>
                    <p id="stat-total-results" class="text-4xl font-bold text-green-400">—</p>
                </div>
            </div>

            <!-- Scans per day chart -->
            <div class="bg-dark-800 border border-dark-700 rounded-xl p-5 shadow-xl">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
                    Scans per Day (Last 14 Days)
                </h2>
                <div id="scans-per-day-chart" style="height:200px;"></div>
            </div>

            <!-- Top plugins chart -->
            <div class="bg-dark-800 border border-dark-700 rounded-xl p-5 shadow-xl">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                    Top Plugins by Findings
                </h2>
                <div id="top-plugins-chart" style="min-height:200px;"></div>
            </div>

            <!-- Audit Log -->
            <div id="audit-tab" class="bg-dark-800 border border-dark-700 rounded-xl p-5 shadow-xl">
                <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/><line x1="16" x2="8" y1="17" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Audit Log
                    <button id="load-audit-btn" class="ml-auto text-[10px] px-2 py-0.5 bg-dark-700 border border-dark-600 rounded hover:bg-dark-600">Load</button>
                </h2>
                <div id="audit-log-container">
                    <p class="text-[11px] text-slate-500">Click Load to fetch audit entries.</p>
                </div>
            </div>

        </div>
    </main>

    <footer class="mt-auto py-6 border-t border-dark-700 text-center text-xs text-slate-500">
        <p>Digital Footprint Tracker — Admin Panel</p>
    </footer>

    <script src="/admin.js"></script>
</body>
</html>
