<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — OSINT Footprint Tracker</title>
    <meta name="description" content="Sign in to Digital Footprint Tracker — a privacy-first, self-hosted OSINT scanner.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark light">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="/tailwind.css?v=3">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="font-mono min-h-screen flex items-center justify-center relative overflow-x-hidden py-6 sm:py-10">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <!-- Grid Background -->
    <div class="absolute inset-0 pointer-events-none opacity-10" style="background-image: linear-gradient(#334155 1px, transparent 1px), linear-gradient(90deg, #334155 1px, transparent 1px); background-size: 30px 30px;"></div>

    <main id="main-content" tabindex="-1" class="relative z-10 w-full max-w-sm px-4">
        <!-- Logo -->
        <div class="text-center mb-6 sm:mb-8">
            <div class="inline-flex items-center gap-3 mb-3">
                <div class="p-3 bg-dark-800 rounded-lg border border-dark-700 shadow-[0_0_15px_rgba(16,185,129,0.2)] text-brand-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
                        <path d="M2 12h20"></path>
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-white">OSINT <span class="text-brand-500">TRACKER</span></h1>
            </div>
            <p class="text-slate-400 text-sm">Sign in to your account</p>
        </div>

        <!-- Form Card -->
        <div class="bg-dark-800 border border-dark-700 rounded-xl p-5 sm:p-6 shadow-2xl">
            <div id="error-msg" class="hidden mb-4 p-3 bg-red-900/30 border border-red-700 rounded text-red-400 text-xs"></div>

            <form id="login-form" method="POST" class="flex flex-col gap-4">
                <div>
                    <label for="username" class="block text-xs text-slate-400 uppercase tracking-wider mb-1.5">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                           class="bg-dark-900 border border-dark-700 text-white text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full px-3 py-2.5 outline-none transition-all placeholder-slate-600"
                           placeholder="your_username">
                </div>
                <div>
                    <label for="password" class="block text-xs text-slate-400 uppercase tracking-wider mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                           class="bg-dark-900 border border-dark-700 text-white text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full px-3 py-2.5 outline-none transition-all placeholder-slate-600"
                           placeholder="••••••••">
                </div>
                <button type="submit" id="submit-btn"
                        class="mt-2 w-full text-white bg-brand-600 hover:bg-brand-500 focus:ring-4 focus:ring-brand-500/50 font-bold rounded-lg text-sm px-5 py-3 text-center transition-colors shadow-[0_0_10px_rgba(16,185,129,0.3)]">
                    LOGIN
                </button>
            </form>

            <!-- Second factor (shown when the account has 2FA enabled) -->
            <form id="twofa-form" class="hidden flex-col gap-4">
                <p class="text-xs text-slate-400">Enter the 6-digit code from your authenticator app, or a recovery code.</p>
                <label for="twofa-code" class="sr-only">Authenticator or recovery code</label>
                <input type="text" id="twofa-code" inputmode="numeric" autocomplete="one-time-code"
                       class="bg-dark-900 border border-dark-700 text-white text-center tracking-[0.3em] text-lg rounded-lg focus:ring-brand-500 focus:border-brand-500 block w-full px-3 py-2.5 outline-none"
                       placeholder="123456">
                <button type="submit" id="twofa-btn"
                        class="w-full text-white bg-brand-600 hover:bg-brand-500 focus:ring-4 focus:ring-brand-500/50 font-bold rounded-lg text-sm px-5 py-3 text-center transition-colors">
                    VERIFY
                </button>
            </form>

            <p class="text-center text-xs text-slate-500 mt-4">
                No account? <a href="/register.html" class="text-brand-400 hover:text-brand-300 underline transition-colors">Register here</a>
            </p>
            <p class="text-center text-xs text-slate-600 mt-2">
                <a href="/" class="hover:text-slate-400 transition-colors">← Back to scanner</a>
            </p>
            <p class="text-center text-xs text-slate-600 mt-3">
                <a href="/privacy.html" class="hover:text-slate-400 transition-colors underline">Privacy</a>
                &middot;
                <a href="/terms.html" class="hover:text-slate-400 transition-colors underline">Terms</a>
                &middot;
                <a href="/acceptable-use.html" class="hover:text-slate-400 transition-colors underline">Acceptable Use</a>
            </p>
        </div>
    </main>

    <script>
        const errEl = document.getElementById('error-msg');
        function showErr(msg) { errEl.textContent = msg; errEl.classList.remove('hidden'); }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.textContent = 'LOGGING IN...';
            btn.disabled = true;
            errEl.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                if (res.ok) {
                    const data = await res.json().catch(() => ({}));
                    if (data.twoFactorRequired) {
                        // Swap to the second-factor form.
                        document.getElementById('login-form').classList.add('hidden');
                        const t = document.getElementById('twofa-form');
                        t.classList.remove('hidden'); t.classList.add('flex');
                        document.getElementById('twofa-code').focus();
                    } else {
                        window.location.href = '/';
                    }
                } else {
                    const data = await res.json().catch(() => ({}));
                    showErr(data.reason || 'Invalid username or password.');
                    btn.textContent = 'LOGIN';
                    btn.disabled = false;
                }
            } catch (e) {
                showErr('Network error. Please try again.');
                btn.textContent = 'LOGIN';
                btn.disabled = false;
            }
        });

        document.getElementById('twofa-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('twofa-btn');
            btn.textContent = 'VERIFYING...';
            btn.disabled = true;
            errEl.classList.add('hidden');
            try {
                const res = await fetch('/api/auth/2fa/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ code: document.getElementById('twofa-code').value })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json().catch(() => ({}));
                    showErr(data.reason || 'Invalid code.');
                    btn.textContent = 'VERIFY';
                    btn.disabled = false;
                }
            } catch (e) {
                showErr('Network error. Please try again.');
                btn.textContent = 'VERIFY';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
