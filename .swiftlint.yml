# SwiftLint configuration for Digital Footprint Tracker.
#
# Most rules ship at "warning" severity — they surface as inline annotations on
# PRs but do not fail CI. Promote a rule to "error" once the codebase is
# consistently clean for it.

disabled_rules:
  - todo                         # In-code reminders are useful and intentional.
  - trailing_comma               # Not enforced project-wide.
  - identifier_name              # Allow short names like `db`, `id`, `ip`, `pr`.
  - function_parameter_count     # Controllers occasionally take many params.
  - cyclomatic_complexity        # Multi-channel notification dispatchers + plugin runners get nested.
  - nesting                      # Closure-heavy SwiftNIO call sites would flood otherwise.

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - sorted_first_last
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - unused_import
  - operator_usage_whitespace
  - closure_spacing
  - explicit_init
  - prefer_self_in_static_references
  - toggle_bool

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true
  ignores_function_declarations: true

type_body_length:
  warning: 500
  error: 800

file_length:
  warning: 800
  error: 1500
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 150

force_cast:       warning
force_try:        warning
force_unwrapping: warning

# Tuples are configurable by *member count*, not severity. The map form below
# sets both thresholds explicitly — without it the default `error: 3` fires on
# any tuple with 3+ members (e.g. the (scanID, input, source, resultType)
# entityMap row in CorrelationController) and fails CI as an error.
large_tuple:
  warning: 3
  error:   6

excluded:
  - .build
  - .swiftpm
  - Packages
  - Tests           # XCTUnwrap / try! patterns are idiomatic in tests.
  - frontend
  - scripts
  - docs

reporter: "github-actions-logging"
