# Bind the app to loopback only. nginx (localhost) is the sole ingress; there is
# no reason for the app port to listen on 0.0.0.0. Defense-in-depth in case ufw
# is ever flushed or a local-network peer (e.g. k8s pod CIDR) can reach the box.
[Service]
ExecStart=
ExecStart=/usr/bin/env AUTO_MIGRATE=false DARK_WEB_WORKER_URL=http://127.0.0.1:8766 REPORT_SCRIPT_PATH=/srv/swift-vapor/current/scripts/generate_report.py /srv/swift-vapor/current/Run serve --env production --hostname 127.0.0.1 --port 8085
