# Bind the app to loopback only. nginx (localhost) is the sole ingress; there is
# no reason for the app port to listen on 0.0.0.0. Defense-in-depth in case ufw
# is ever flushed or a local-network peer (e.g. k8s pod CIDR) can reach the box.
[Service]
ExecStart=
ExecStart=/home/micu/swift+vapor/.build/release/Run serve --env production --hostname 127.0.0.1 --port 8085
