[Service]
# Filesystem isolation — root and /usr read-only, /home read-only.
# App writes go to /tmp (isolated by PrivateTmp) and to Postgres over TCP.
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes

# Privilege isolation
NoNewPrivileges=yes
LockPersonality=yes
RestrictSUIDSGID=yes

# Kernel surface reduction
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectProc=invisible
ProcSubset=pid

# Network — UNIX + IPv4 + IPv6 only (no AF_NETLINK, AF_PACKET, etc.)
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=yes
RestrictRealtime=yes

# Misc
SystemCallArchitectures=native
RemoveIPC=yes
