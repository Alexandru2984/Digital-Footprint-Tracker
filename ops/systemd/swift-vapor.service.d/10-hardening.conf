[Service]
# Filesystem isolation — root and /usr read-only; other projects and credentials
# under /home are hidden. Only the selected immutable release is exposed.
# App writes go to /tmp (isolated by PrivateTmp) and to Postgres over TCP.
ProtectSystem=strict
ProtectHome=true
BindReadOnlyPaths=/srv/swift-vapor/current
PrivateTmp=yes
PrivateDevices=yes
ProtectHostname=yes

# Privilege isolation
NoNewPrivileges=yes
LockPersonality=yes
RestrictSUIDSGID=yes
CapabilityBoundingSet=
AmbientCapabilities=
UMask=0077
KeyringMode=private

# Kernel surface reduction
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectProc=invisible
ProcSubset=pid
# A compromised web process must not inherit host control through a container
# runtime socket, even if a future group-membership regression makes one
# readable. The leading '-' keeps deployment portable when a runtime is absent.
InaccessiblePaths=-/run/docker.sock -/run/containerd/containerd.sock -/run/podman/podman.sock

# Network — UNIX + IPv4 + IPv6 only (no AF_NETLINK, AF_PACKET, etc.)
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
# The service only listens on its loopback HTTP port. Child tools retain
# outbound client connections, but cannot expose surprise listeners.
SocketBindAllow=ipv4:tcp:8085
SocketBindDeny=any
# Defense-in-depth behind application SSRF validation: a compromised plugin or
# subprocess cannot pivot into RFC1918, link-local, metadata, benchmark, or
# documentation networks. PostgreSQL and the local resolver remain reachable
# through loopback, which is intentionally not denied.
IPAddressDeny=0.0.0.0/8 10.0.0.0/8 100.64.0.0/10
IPAddressDeny=169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16
IPAddressDeny=192.0.2.0/24 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24
IPAddressDeny=224.0.0.0/4 240.0.0.0/4
IPAddressDeny=::/128 100::/64 2001:2::/48 2001:db8::/32
IPAddressDeny=fc00::/7 fe80::/10 ff00::/8
RestrictNamespaces=yes
RestrictRealtime=yes

# Misc
SystemCallArchitectures=native
MemoryDenyWriteExecute=yes
RemoveIPC=yes

# Host-safe ceilings. These are intentionally above normal observed usage but
# prevent a compromised or wedged scan fan-out from consuming the shared VPS.
MemoryHigh=1536M
MemoryMax=2G
CPUQuota=400%
TasksMax=512
LimitNOFILE=8192
