# Restart=always means the unit only reaches `failed` after the start limit is
# exceeded (5 starts in 10s), i.e. a hard crash-loop. That is worth waking up
# for. Quieter degradation — up but unhealthy, or restarting slowly enough to
# never trip the limit — is caught by swift-vapor-healthcheck.timer instead.
[Unit]
OnFailure=swift-vapor-alert@%n.service
