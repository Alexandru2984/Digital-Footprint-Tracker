groups:
  - name: swift-vapor-availability
    rules:
      - alert: SwiftVaporTargetMissing
        expr: absent(up{job="swift-vapor"}) or up{job="swift-vapor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Swift Vapor metrics target is unavailable
          description: Prometheus has not successfully scraped the swift-vapor target for two minutes.

      - alert: SwiftVaporBackupSignalMissing
        expr: absent(swift_vapor_backup_last_success_unixtime)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Swift Vapor backup freshness signal is missing
          description: The application is not publishing a verified-backup timestamp.

      - alert: SwiftVaporBackupStale
        expr: swift_vapor_backup_fresh == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Swift Vapor encrypted database backup is stale or missing
          description: No locally verified encrypted backup exists inside the configured freshness window.

      - alert: SwiftVaporSensitiveFieldDecryptionFailure
        expr: increase(swift_vapor_sensitive_field_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Swift Vapor rejected a corrupted encrypted field
          description: Authenticated field decryption failed; the affected read/job path was quarantined and requires operator investigation.

      - alert: SwiftVaporAuditWriteFailure
        expr: increase(swift_vapor_audit_log_write_failures_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: Swift Vapor could not persist a signed audit event
          description: At least one audit display row and integrity-ledger transaction rolled back; investigate database and signing-key health.

      - alert: SwiftVaporAuditIntegrityInvalid
        expr: swift_vapor_audit_integrity_status == 0
        labels:
          severity: critical
        annotations:
          summary: Swift Vapor audit integrity verification failed
          description: The signed audit ledger, its chain head, or a retained audit row no longer matches its authenticated commitment.

      - alert: SwiftVaporAuditIntegrityStale
        expr: swift_vapor_audit_integrity_last_verified_unixtime == 0 or time() - swift_vapor_audit_integrity_last_verified_unixtime > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Swift Vapor audit integrity has not been verified recently
          description: No complete audit-ledger verification has succeeded or failed within the last fifteen minutes.

      - alert: SwiftVaporNotificationDeadLetter
        expr: swift_vapor_notification_jobs_dead_letter > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Swift Vapor has dead-letter notification deliveries
          description: At least one automatic notification exhausted retry or failed permanently and requires operator review.

      - alert: SwiftVaporNotificationLeaseExpired
        expr: swift_vapor_notification_expired_leases > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Swift Vapor notification leases are not being recovered
          description: One or more delivery leases remained expired, indicating that the durable worker is stopped or unhealthy.

      - alert: SwiftVaporNotificationQueueDelayed
        expr: swift_vapor_notification_oldest_pending_age_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Swift Vapor notification queue is delayed
          description: The oldest pending automatic notification has waited longer than five minutes.

      - alert: SwiftVaporExportQueueDelayed
        expr: swift_vapor_export_oldest_pending_age_seconds > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Swift Vapor export queue is delayed
          description: The oldest pending asynchronous export has waited longer than five minutes.

      - alert: SwiftVaporExportLeaseExpired
        expr: swift_vapor_export_expired_leases > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Swift Vapor export leases are not being recovered
          description: One or more export leases remained expired, indicating that the bounded worker is stopped or unhealthy.

      - alert: SwiftVaporExportFailures
        expr: increase(swift_vapor_export_jobs_total{status="failed"}[15m]) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Swift Vapor exports are repeatedly failing
          description: More than two asynchronous exports failed in fifteen minutes; inspect bounded failure codes and worker health.
