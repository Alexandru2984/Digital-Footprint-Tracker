# Forwarding headers for every proxied location in the clearnet swift vhost.
#
# This exists because the headers were repeated per location and one location
# eventually gets written without them. That is not hypothetical: on the onion
# vhost `/health` and `/metrics` were missing the X-Real-IP line, and since
# `Request.clientIP` trusts X-Real-IP from a loopback peer, a client-supplied
# X-Real-IP passed straight through and became the address the application
# rate-limited on.
#
# Both spoofable headers are overwritten here, not just the one that currently
# wins the priority order in `Request.clientIP` — a header this file does not
# set is a header the client sets.
proxy_http_version 1.1;
proxy_set_header  Host              $host;
proxy_set_header  X-Real-IP         $remote_addr;
proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header  X-Forwarded-Proto $scheme;
proxy_set_header  CF-Connecting-IP  $remote_addr;
