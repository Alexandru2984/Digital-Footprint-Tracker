# Forwarding headers for every proxied location in the onion vhost.
#
# X-Real-IP is pinned to loopback on purpose: Tor visitors get no source address
# recorded at all. The tradeoff is deliberate and documented in the vhost — they
# share one rate-limit bucket.
#
# CF-Connecting-IP is pinned too. It is redundant while `Request.clientIP` reads
# X-Real-IP first, and that is exactly the reason to set it: a protection that
# holds only because of an ordering decision in unrelated code is one refactor
# away from not holding.
proxy_http_version 1.1;
proxy_set_header  Host              $host;
proxy_set_header  X-Real-IP         127.0.0.1;
proxy_set_header  CF-Connecting-IP  127.0.0.1;
proxy_set_header  X-Forwarded-For   127.0.0.1;
proxy_set_header  X-Forwarded-Proto https;
