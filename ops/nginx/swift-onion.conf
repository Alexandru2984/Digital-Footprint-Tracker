# swift.micutu.com Tor onion service. Served over the hidden service (torrc:
# HiddenServiceDir /var/lib/tor/swift/ → 127.0.0.1:8110). No TLS/HSTS: Tor already
# provides transport encryption + endpoint authentication via the .onion address.
# X-Real-IP is pinned to loopback on purpose — Tor users get NO source IP recorded
# (max privacy); the tradeoff is a shared per-IP rate-limit bucket for onion traffic.
server {
    listen 127.0.0.1:8110;
    server_name 5jyd4lflkewyc3gm42uxvi2aryh5g2l4ib2pm5uewpff3ld7yfii5iid.onion;

    include snippets/block-dotfiles.conf;

    add_header X-Frame-Options        "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag           "noindex, nofollow" always;
    include snippets/swift-csp.conf;

    location /robots.txt { root /srv/swift-vapor/current/frontend; access_log off; }
    location / { root /srv/swift-vapor/current/frontend; index index.html; try_files $uri $uri/ /index.html; }

    location /api/scan {
        limit_req zone=scan_limit burst=20 nodelay; limit_req_status 429; client_max_body_size 10k;
        proxy_pass http://127.0.0.1:8085/scan;
        proxy_http_version 1.1; proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1; proxy_set_header X-Forwarded-Proto https;
    }
    location /api/stream/ {
        limit_req zone=api_limit burst=50 nodelay; limit_req_status 429; client_max_body_size 10k;
        proxy_buffering off; proxy_cache off; proxy_read_timeout 130s;
        proxy_pass http://127.0.0.1:8085/stream/;
        proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1; proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/investigations {
        limit_req zone=api_limit burst=20 nodelay; limit_req_status 429; client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8085/investigations;
        proxy_http_version 1.1; proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1; proxy_set_header X-Forwarded-Proto https;
    }
    # Onion visitors share one rate-limit bucket (X-Real-IP pinned to loopback),
    # which let slow crawlers register junk accounts and flood the mail queue
    # with verification emails to fake addresses. Email round-trips are useless
    # over Tor anyway - block the email-sending auth endpoints here only; the
    # clearnet vhost keeps them.
    location = /api/auth/register            { return 404; }
    location = /api/auth/resend-verification { return 404; }

    location /health  { proxy_pass http://127.0.0.1:8085/health;  proxy_set_header Host $host; }
    location = /ready { return 404; }
    location /metrics { proxy_pass http://127.0.0.1:8085/metrics; proxy_set_header Host $host; }
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay; limit_req_status 429; client_max_body_size 10k;
        proxy_pass http://127.0.0.1:8085/;
        proxy_http_version 1.1; proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1; proxy_set_header X-Forwarded-Proto https;
    }
}
